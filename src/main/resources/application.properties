spring.datasource.url=jdbc:mysql://localhost:3306/user_management?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=newpassword

spring.jpa.properties.hibernate=org.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=*

info.app.name=springbootrestfulwebservices
info.app.description= Spring Boot Restful web servcies
info.app.version=v1.0
management.info.env.enabled=true
management.endpoint.health.show-details=always

management.endpoint.shutdown.enabled=true